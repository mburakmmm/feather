name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.8)'
        required: true
        default: 'v0.2.8'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Cross-Platform CI Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nox (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.ps1 | iex
          echo "$env:USERPROFILE\.nox-lang\bin" >> $env:GITHUB_PATH

      - name: Verify Compiler
        run: |
          noxc version

      - name: Static Typecheck
        run: |
          noxc check feather.nox
          noxc check main.nox

      - name: Run Test Suites
        run: |
          noxc test

      - name: Run Verification Demo
        run: |
          noxc run main.nox

  publish-release:
    name: Create GitHub Release & Publish Package
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Resolve Release Tag & Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          python3 -c '
          import re, sys
          tag = "${{ steps.vars.outputs.tag }}"
          version = "${{ steps.vars.outputs.version }}"
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()
          pattern = r"## \[" + re.escape(version) + r"\].*?\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = "Feather " + tag + " release."
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as out:
              out.write(notes + "\n")
          '

      - name: Package Distribution Archives
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          tar --exclude='.git' --exclude='.github' --exclude='*.tar.gz' --exclude='*.zip' -czf "feather-${TAG}.tar.gz" .
          zip -r "feather-${TAG}.zip" . -x '*.git*' '*.github*' '*.tar.gz' '*.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            feather-${{ steps.vars.outputs.tag }}.tar.gz
            feather-${{ steps.vars.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Nox Central Index
        continue-on-error: true
        run: |
          noxc publish https://github.com/mburakmmm/feather
